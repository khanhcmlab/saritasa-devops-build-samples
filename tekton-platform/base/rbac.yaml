apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-service-account
  namespace: default
secrets:
  - name: ghcr-creds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-role
  namespace: default
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "pipelines", "tasks"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-role-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: pipeline-service-account
    namespace: default
roleRef:
  kind: Role
  name: pipeline-role
  apiGroup: rbac.authorization.k8s.io