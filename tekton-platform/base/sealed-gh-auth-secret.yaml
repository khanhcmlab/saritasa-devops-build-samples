# Secret Documentation:
# - Why it is needed: Used by the git-clone task in the pipeline to authenticate with GitHub to clone private repositories.
# - Expiration date: 30 days
# - How to renew:
#   1. Generate a new Personal Access Token (PAT) with "repo" scope on GitHub.
#   2. Re-create and seal the secret locally:
#      kubectl create secret generic github-auth --from-literal=username=<username> --from-literal=password=<PAT> --dry-run=client -o yaml | kubeseal --format=yaml > sealed-gh-auth-secret.yaml
#   3. Apply the updated sealed-gh-auth-secret.yaml to your cluster.
# - Where to renew (url): https://github.com/settings/tokens
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: github-auth
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
        tekton.dev/git-0: https://github.com
      name: github-auth
