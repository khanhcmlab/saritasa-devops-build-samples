# Secret Documentation:
# - Why it is needed: Used by the Tekton EventListener (gh-event-listener) to validate the authenticity of incoming GitHub webhook payloads (HMAC signature verification).
# - Expiration date: None.
# - How to renew:
#   1. Generate a new random token string.
#   2. Update the webhook secret on GitHub settings for the repository.
#   3. Re-create and seal the secret locally:
#      kubectl create secret generic github-webhook-secret --from-literal=token=<token> --dry-run=client -o yaml | kubeseal --format=yaml > sealed-gh-webhook-secret.yaml
#   4. Apply the updated sealed-gh-webhook-secret.yaml to your cluster.
# - Where to renew (url): https://github.com/<owner>/<repo>/settings/webhooks
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: github-webhook-secret
spec:
  encryptedData:
    token: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: github-webhook-secret
    type: Opaque
