# Secret Documentation:
# - Why it is needed: Used by the container build tools (e.g., Cloud Native Buildpacks) to authenticate with GitHub Container Registry (GHCR) to push/pull container images.
# - Expiration date: 30 days
# - How to renew:
#   1. Generate a new Personal Access Token (PAT) on GitHub with "write:packages" and "read:packages" scopes.
#   2. Re-create and seal the docker-registry secret locally:
#      kubectl create secret docker-registry ghcr-creds --docker-server=ghcr.io --docker-username=<username> --docker-password=<PAT> --dry-run=client -o yaml | kubeseal --format=yaml > sealed-ghcr-secret.yaml
#   3. Apply the updated sealed-ghcr-secret.yaml to your cluster.
# - Where to renew (url): https://github.com/settings/tokens
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: ghcr-creds
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: ghcr-creds
    type: kubernetes.io/dockerconfigjson
