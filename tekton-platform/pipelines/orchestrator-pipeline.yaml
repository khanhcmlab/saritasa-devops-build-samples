apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: orchestrator-pipeline
  namespace: saritasa-test
spec:
  params:
    - name: gitrevision
      type: string
      description: The git revision/sha to build.
    - name: gitrepositoryurl
      type: string
      description: The git repository URL.
    - name: action
      type: string
      description: The action to perform (build or deploy).
      default: "build"
    - name: registry-path
      type: string
      description: The target docker registry path.
      default: "ghcr.io/dewwripper"
  workspaces:
    - name: source-workspace
      description: Shared workspace for cloning, change detection, and building.
  tasks:
    - name: check-concurrency
      taskRef:
        name: check-concurrency
      params:
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
    - name: git-clone
      runAfter:
        - check-concurrency
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: source-workspace
      params:
        - name: url
          value: "$(params.gitrepositoryurl)"
        - name: revision
          value: "$(params.gitrevision)"
        - name: deleteExisting
          value: "true"
        - name: depth
          value: "2"
    - name: detect-changes
      runAfter:
        - git-clone
      workspaces:
        - name: source
          workspace: source-workspace
      taskRef:
        name: detect-changes
      params:
        - name: gitrevision
          value: "$(params.gitrevision)"
        - name: registry-path
          value: "$(params.registry-path)"
    - name: dispatch-pipelineruns
      runAfter:
        - detect-changes
      when:
        - input: "$(tasks.detect-changes.results.should-build)"
          operator: in
          values: ["true"]
      matrix:
        params:
          - name: COMPONENT
            value: $(tasks.detect-changes.results.changed-modules-json[*])
      taskRef:
        name: dispatch-pipelinerun
      params:
        - name: gitrevision
          value: "$(params.gitrevision)"
        - name: gitrepositoryurl
          value: "$(params.gitrepositoryurl)"
        - name: registry-path
          value: "$(params.registry-path)"
        - name: action
          value: "$(params.action)"
