apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildpack-build
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Image Build
    tekton.dev/pipelines.minVersion: "0.17.0"
    tekton.dev/tags: image-build
    tekton.dev/displayName: "Buildpacks Build via Pack CLI"
spec:
  description: >-
    Builds source code into a container image and pushes it to a registry
    using the pack CLI and Paketo Buildpacks.
  workspaces:
    - name: source
      description: Workspace containing the application source code.
  params:
    - name: APP_IMAGE
      type: string
      description: The name of the image to build and push (e.g. ghcr.io/org/repo:tag).
    - name: BUILDER_IMAGE
      type: string
      description: The Paketo builder image to use (e.g. paketobuildpacks/builder-jammy-base:latest).
    - name: SOURCE_SUBPATH
      type: string
      description: Subpath within the source workspace where the build context is located.
      default: ""
    - name: BUILDPACK
      type: string
      description: Optional buildpack to use (e.g. paketo-buildpacks/python).
      default: ""
    - name: ADDITIONAL_ARGS
      type: string
      description: Additional arguments to pass to the pack build command.
      default: ""
  steps:
    - name: pack-build
      image: buildpacksio/pack:latest
      env:
        - name: APP_IMAGE
          value: $(params.APP_IMAGE)
        - name: BUILDER_IMAGE
          value: $(params.BUILDER_IMAGE)
        - name: SOURCE_SUBPATH
          value: $(params.SOURCE_SUBPATH)
        - name: BUILDPACK
          value: $(params.BUILDPACK)
        - name: ADDITIONAL_ARGS
          value: $(params.ADDITIONAL_ARGS)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      script: |
        sh $(workspaces.source.path)/tekton-platform/scripts/buildpack-build.sh
