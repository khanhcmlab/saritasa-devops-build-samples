apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: check-concurrency
spec:
  params:
    - name: pipelinerun-name
      type: string
      description: The name of the current PipelineRun.
    - name: max-concurrency
      type: string
      description: Maximum number of concurrent PipelineRuns allowed in the namespace.
    - name: namespace
      type: string
      description: The namespace to check active PipelineRuns in.
  steps:
    - name: check-concurrency
      image: alpine/k8s:1.33.13
      script: |
        #!/bin/sh
        set -e

        CURRENT_RUN="$(params.pipelinerun-name)"
        MAX_CONCURRENCY="$(params.max-concurrency)"
        NAMESPACE="$(params.namespace)"

        if [ -z "${CURRENT_RUN}" ]; then
          echo "No PipelineRun name provided. Skipping concurrency check."
          exit 0
        fi

        echo "Checking concurrency queue status for PipelineRun: ${CURRENT_RUN}"
        echo "Max allowed concurrent runs: ${MAX_CONCURRENCY}"

        while true; do
          # Get all active PipelineRuns, sorted by creation time (oldest first)
          ALL_ACTIVE_RUNS=$(kubectl get pipelinerun -n ${NAMESPACE} -o json | \
            jq -r '.items[] | select(.status.conditions[]? | select(.type=="Succeeded" and .status=="Unknown")) | "\(.metadata.name) \(.metadata.creationTimestamp)"' | \
            sort -k2)

          if [ -z "${ALL_ACTIVE_RUNS}" ]; then
            echo "No active PipelineRuns found. Proceeding."
            break
          fi

          # Get the list of Top X oldest PipelineRun names that are allowed to run
          ALLOWED_RUNS=$(echo "${ALL_ACTIVE_RUNS}" | head -n ${MAX_CONCURRENCY} | awk '{print $1}')

          # Check if the CURRENT_RUN is within the allowed list
          if echo "${ALLOWED_RUNS}" | grep -q "^${CURRENT_RUN}$"; then
            echo "Current PipelineRun is within the allowed concurrency slot. Proceeding!"
            break
          fi

          # If not within the allowed list, print the current holders for debugging
          CURRENT_HOLDERS=$(echo "${ALLOWED_RUNS}" | tr '\n' ',' | sed 's/,$//')
          echo "Queue is full. Active slots held by: [${CURRENT_HOLDERS}]. Waiting 10 seconds..."
          sleep 10
        done
