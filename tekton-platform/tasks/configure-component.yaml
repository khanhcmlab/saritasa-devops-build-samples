apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: configure-component
  namespace: saritasa-test
spec:
  params:
    - name: gitrevision
      type: string
      description: The git revision/sha to build.
    - name: registry-path
      type: string
      description: The target docker registry path.
      default: "ghcr.io/dewwripper"
    - name: component
      type: string
      description: "The component to configure."
  workspaces:
    - name: source
      description: Workspace containing the cloned repository.
  results:
    - name: component-name
      description: "Clean name for Kubernetes deployment"
    - name: source-subpath
      description: "Subpath within the workspace where the component is located"
    - name: builder
      description: "Builder image to use"
    - name: image
      description: "Target image name to build"
    - name: image-tag
      description: "Sanitized tag used for the image"
    - name: process-type
      description: "Default process type for the component (e.g. web or binary name)"
  steps:
    - name: configure
      image: alpine/git:v2.30.2
      script: |
        #!/bin/sh
        set -e

        cd $(workspaces.source.path)

        CHANGED_COMPONENT="$(params.component)"
        echo "Configuring component: ${CHANGED_COMPONENT}"

        # Create cache directory for component
        mkdir -p $(workspaces.source.path)/cache/${CHANGED_COMPONENT}

        echo -n "${CHANGED_COMPONENT}" > $(results.source-subpath.path)

        # Clean name for deployment
        clean_name=$(echo "${CHANGED_COMPONENT}" | tr '/_' '--')
        echo -n "${clean_name}" > $(results.component-name.path)

        # Sanitize gitrevision for image tag
        tag="$(params.gitrevision)"
        clean_tag=$(echo "${tag}" | tr '/' '-')
        echo -n "${clean_tag}" > $(results.image-tag.path)
        image="$(params.registry-path)/${clean_name}:${clean_tag}"
        echo -n "${image}" > $(results.image.path)

        # Initialize default config values
        builder="paketobuildpacks/builder-jammy-base:latest"
        buildpack=""
        additional_args=""
        descriptor=""
        source_subpath="${CHANGED_COMPONENT}"

        # Tech stack is determined by the first segment of the component path (e.g., "go" for "go/hello-world")
        TECH_STACK="${CHANGED_COMPONENT%%/*}"

        # Map tech stack to buildpack and builder, with special handling for web-servers group and Java versions
        case "${TECH_STACK}" in
          ca-certificates) buildpack="paketo-buildpacks/go" ;;
          web-servers)     # Special handling for web-servers group
              if [ "${CHANGED_COMPONENT}" = "web-servers/httpd-sample" ]; then buildpack="paketo-buildpacks/httpd"; builder="paketobuildpacks/builder-jammy-full:latest"
              elif [ "${CHANGED_COMPONENT}" = "web-servers/nginx-sample" ]; then buildpack="paketo-buildpacks/nginx"
              else buildpack="paketo-buildpacks/web-servers"; fi ;;
          *)               # All other languages (go, nodejs, python, ruby, php, dotnet-core) follow this pattern
              buildpack="paketo-buildpacks/${TECH_STACK}" ;;
        esac

        # Only keep cases that require additional environment variables
        set --
        case "${CHANGED_COMPONENT}" in
        "git/git-sample")
            source_subpath="git/git-sample/app"
            ;;
        "nodejs/angular-npm" | "nodejs/vue-npm")
            set -- --env "BP_NODE_RUN_SCRIPTS=build" --env "NODE_ENV=development"
            ;;
        "nodejs/react-yarn")
            set -- --env "BP_NODE_RUN_SCRIPTS=build"
            ;;
        "php/composer")
            set -- --env "BP_PHP_WEB_DIR=htdocs"
            ;;
        "php/memcached_session_handler" | "php/redis_session_handler")
            set -- --env "BP_PHP_WEB_DIR=htdocs" --env "SERVICE_BINDING_ROOT=/bindings"
            ;;
        "web-servers/angular-nginx-sample")
            set -- --env "BP_NODE_RUN_SCRIPTS=build" --env "BP_WEB_SERVER=nginx" --env "BP_WEB_SERVER_ROOT=dist/my-project-name" --env "BP_WEB_SERVER_ENABLE_PUSH_STATE=true"
            ;;
        "web-servers/react-frontend-sample")
            set -- --env "BP_NODE_RUN_SCRIPTS=build" --env "BP_WEB_SERVER=httpd" --env "BP_WEB_SERVER_ROOT=build" --env "BP_WEB_SERVER_ENABLE_PUSH_STATE=true"
            ;;
        
        # Special handling for Java versions
        java/akka | java/deps | java/leiningen)
            set -- --env "BP_JVM_VERSION=11"
            ;;
        java/application-insights | java/aspectj | java/jar | java/kotlin | java/war-spring)
            set -- --env "BP_JVM_VERSION=17"
            if [ "${CHANGED_COMPONENT}" = "java/war-spring" ]; then
              set -- "$@" --env "BP_TOMCAT_VERSION=10"
            fi
            ;;
        java/dist-zip)
            set -- --env "BP_GRADLE_BUILD_ARGUMENTS=--no-daemon -x test bootDistZip" --env "BP_GRADLE_BUILT_ARTIFACT=build/distributions/*.zip" --env "BP_JVM_VERSION=17"
            ;;
        java/java-node/gradle-node)
            builder="paketobuildpacks/builder-jammy-base"
            set -- --env "BP_JVM_VERSION=21" --env "BP_JAVA_INSTALL_NODE=true" --env "BP_NODE_PROJECT_PATH=frontend"
            ;;
        java/java-node/maven-yarn)
            set -- --env "BP_JVM_VERSION=17" --env "BP_JAVA_INSTALL_NODE=true"
            ;;
        java/native-image/quarkus-native-image-maven)
            builder="paketobuildpacks/builder-jammy-tiny"
            set -- --env "BP_NATIVE_IMAGE=true" --env "BP_MAVEN_ADDITIONAL_BUILD_ARGUMENTS=-Dquarkus.package.type=native-sources" --env "BP_MAVEN_BUILT_ARTIFACT=target/native-sources" --env "BP_NATIVE_IMAGE_BUILD_ARGUMENTS_FILE=native-sources/native-image.args" --env "BP_NATIVE_IMAGE_BUILT_ARTIFACT=native-sources/*-runner.jar" --env "BP_JVM_VERSION=21"
            ;;
        java/native-image/spring-boot-native-image-gradle)
            builder="paketobuildpacks/builder-jammy-tiny"
            set -- --env "BP_NATIVE_IMAGE=true"
            ;;
        java/native-image/spring-boot-native-image-maven)
            builder="paketobuildpacks/builder-jammy-tiny"
            set -- --env "BP_NATIVE_IMAGE=true" --env "BP_MAVEN_BUILD_ARGUMENTS=-Dmaven.test.skip=true --no-transfer-progress package -Pnative" --env "BP_JVM_VERSION=17"
            ;;
        java/opentelemetry)
            set -- --buildpack "paketo-buildpacks/java" --buildpack "docker.io/paketobuildpacks/opentelemetry" --env "BP_OPENTELEMETRY_ENABLED=true" --env "BP_JVM_VERSION=17"
            ;;
        esac

        # Output source-subpath update if needed
        echo -n "${source_subpath}" > $(results.source-subpath.path)

        # Prepare path to component directory
        path_to_app="$(workspaces.source.path)/${source_subpath}"

        if [ "${CHANGED_COMPONENT}" = "web-servers/react-frontend-sample" ] && [ -f "${path_to_app}/httpd.toml" ]; then
          echo "Copying descriptor httpd.toml to project.toml..."
          cp "${path_to_app}/httpd.toml" "${path_to_app}/project.toml"
        else
          toml_content=""
          if [ -n "${buildpack}" ]; then
            toml_content="[[build.buildpacks]]\nid = \"${buildpack}\"\n"
          fi

          while [ $# -gt 0 ]; do
            case "$1" in
            --env)
              arg="$2"; shift
              arg="${arg#[\"\']}"; arg="${arg%[\"\']}"
              key="${arg%%=*}"
              val="${arg#*=}"
              toml_content="${toml_content}[[build.env]]\nname = \"${key}\"\nvalue = \"${val}\"\n"
              ;;
            --buildpack)
              bp="$2"; shift
              bp="${bp#[\"\']}"; bp="${bp%[\"\']}"
              toml_content="${toml_content}[[build.buildpacks]]\nid = \"${bp}\"\n"
              ;;
            esac
            shift
          done

          if [ -n "${toml_content}" ]; then
            mkdir -p "${path_to_app}"
            if [ -f "${path_to_app}/project.toml" ]; then
              echo "Merging custom configurations into existing project.toml for ${CHANGED_COMPONENT}..."
              # Ensure there is a trailing newline at the end of the existing file to avoid syntax issues
              echo "" >> "${path_to_app}/project.toml"
              printf "${toml_content}" >> "${path_to_app}/project.toml"
            else
              echo "Writing custom project.toml for ${CHANGED_COMPONENT}..."
              printf "${toml_content}" > "${path_to_app}/project.toml"
            fi
            echo "Final project.toml content:"
            cat "${path_to_app}/project.toml"
          fi
        fi

        # Output remaining results
        echo -n "${builder}" > $(results.builder.path)

        # Output process-type result
        PROCESS_TYPE=""
        # if [ "${TECH_STACK}" = "go" ] || [ "${TECH_STACK}" = "ca-certificates" ]; then
        #   PROCESS_TYPE="workspace"
        # elif [ "${TECH_STACK}" = "dotnet-core" ]; then
        #   PROCESS_TYPE=""
        # fi
        echo -n "${PROCESS_TYPE}" > $(results.process-type.path)
