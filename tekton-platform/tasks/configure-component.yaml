apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: configure-component
  namespace: saritasa-test
spec:
  params:
    - name: gitrevision
      type: string
      description: The git revision/sha to build.
    - name: registry-path
      type: string
      description: The target docker registry path.
      default: "ghcr.io/dewwripper"
    - name: component
      type: string
      description: "The component to configure."
  workspaces:
    - name: source
      description: Workspace containing the cloned repository.
  results:
    - name: component-name
      description: "Clean name for Kubernetes deployment"
    - name: source-subpath
      description: "Subpath within the workspace where the component is located"
    - name: builder
      description: "Builder image to use"
    - name: image
      description: "Target image name to build"
    - name: image-tag
      description: "Sanitized tag used for the image"
    - name: process-type
      description: "Default process type for the component (e.g. web or binary name)"
    - name: env-vars
      type: array
      description: "Environment variables parsed from project.toml"
  steps:
    - name: configure
      image: alpine/git:v2.30.2
      script: |
        #!/bin/sh
        set -e

        cd $(workspaces.source.path)

        CHANGED_COMPONENT="$(params.component)"
        echo "Configuring component: ${CHANGED_COMPONENT}"

        # Create cache directory for component
        mkdir -p $(workspaces.source.path)/cache/${CHANGED_COMPONENT}

        echo -n "${CHANGED_COMPONENT}" > $(results.source-subpath.path)

        # Clean name for deployment
        clean_name=$(echo "${CHANGED_COMPONENT}" | tr '/_' '--')
        echo -n "${clean_name}" > $(results.component-name.path)

        # Sanitize gitrevision for image tag
        tag="$(params.gitrevision)"
        clean_tag=$(echo "${tag}" | tr '/' '-')
        echo -n "${clean_tag}" > $(results.image-tag.path)
        image="$(params.registry-path)/${clean_name}:${clean_tag}"
        echo -n "${image}" > $(results.image.path)

        # Initialize default config values
        builder="paketobuildpacks/builder-jammy-full:latest"
        buildpack=""
        source_subpath="${CHANGED_COMPONENT}"

        TECH_STACK="${CHANGED_COMPONENT%%/*}"

        echo -n "${source_subpath}" > "$(results.source-subpath.path)"
        path_to_app="$(workspaces.source.path)/${source_subpath}"
        target_toml="${path_to_app}/project.toml"

        if [[ ! -f "${target_toml}" ]]; then
          echo "project.toml is not exists. Creating..."
          mkdir -p "${path_to_app}"
          cat << EOF > "${target_toml}"
        [[build.buildpacks]]
        id = "paketo-buildpacks/${TECH_STACK}"
        EOF
          echo "Create project.toml succesfully for ${TECH_STACK}"
        else
          echo "Found ${TECH_STACK} project.toml. Skip this step"
        fi

        ENV_VARS_JSON="[]"
        if [[ -f "${target_toml}" ]]; then
          echo "Parsing Environment Variables from ${target_toml}..."

          parsed_envs=$(awk -F '"' '
              /\[\[build.env\]\]/ { in_env=1; next }
              /^\[/ { in_env=0 }
              in_env && /name *=/  { name=$2 }
              in_env && /value *=/ { value=$2; if(name!="") { print name "=" value; name="" } }
          ' "${target_toml}")

          if [[ -n "${parsed_envs}" ]]; then
              ENV_VARS_JSON=$(echo "${parsed_envs}" | awk 'BEGIN {printf "["} {printf "%s\"%s\"", (NR==1?"":","), $0} END {print "]"}')
          fi
        fi

        echo "ENV_VARS_JSON=${ENV_VARS_JSON}"

        # Output remaining results
        echo -n "${builder}" > $(results.builder.path)

        # Output process-type result
        echo -n "${PROCESS_TYPE}" > $(results.process-type.path)

        # Output env-vars result
        echo -n "${ENV_VARS_JSON}" > $(results.env-vars.path)