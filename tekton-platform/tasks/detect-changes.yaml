apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: detect-changes
spec:
  workspaces:
    - name: shared-workspace
      description: Workspace containing the repository files and scripts.
  params:
    - name: gitrevision
      type: string
    - name: gitrepositoryurl
      type: string
  results:
    - name: changed-components
      description: Space-separated list of components that changed.
  steps:
    - name: run-diff-and-dispatch
      image: alpine/git:v2.30.2
      workingDir: $(workspaces.shared-workspace.path)
      env:
        - name: RESULT_PATH
          value: $(results.changed-components.path)
      script: |
        sh $(workspaces.shared-workspace.path)/tekton-platform/scripts/detect-changes.sh
