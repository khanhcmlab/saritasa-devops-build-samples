apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: detect-changes
  namespace: saritasa-test
spec:
  params:
    - name: gitrevision
      type: string
      description: The git revision/sha to build.
    - name: registry-path
      type: string
      description: The target docker registry path.
      default: "ghcr.io/dewwripper"
  workspaces:
    - name: source
      description: Workspace containing the cloned repository.
  results:
    - name: should-build
      description: "true if a buildpack component has changed and needs to be built, false otherwise"
    - name: component-name
      description: "Clean name for Kubernetes deployment"
    - name: source-subpath
      description: "Subpath within the workspace where the component is located"
    - name: builder
      description: "Builder image to use"
    - name: image
      description: "Target image name to build"
    - name: changed-modules-json
      type: array
      description: "JSON array of changed modules"
  steps:
    - name: run-diff-and-configure
      image: alpine/git:v2.30.2
      script: |
        #!/bin/sh
        set -e

        cd $(workspaces.source.path)

        # Find all modules (directories containing code/projects buildable by pack build)
        # excluding tekton-platform, tests, scripts, kubernetes, kustomize, and docker
        MODULES=""
        for dir in *; do
          if [ -d "${dir}" ]; then
            case "${dir}" in
              tekton-platform|tests|scripts|kubernetes|kustomize|docker)
                continue
                ;;
            esac

            if [ "${dir}" = "java" ]; then
              for javadir in java/*; do
                if [ -d "${javadir}" ]; then
                  if [ "${javadir}" = "java/java-node" ] || [ "${javadir}" = "java/native-image" ]; then
                    for subjavadir in ${javadir}/*; do
                      if [ -d "${subjavadir}" ]; then
                        MODULES="${MODULES} ${subjavadir}"
                      fi
                    done
                  else
                    MODULES="${MODULES} ${javadir}"
                  fi
                fi
              done
            else
              for subdir in ${dir}/*; do
                if [ -d "${subdir}" ]; then
                  MODULES="${MODULES} ${subdir}"
                fi
              done
            fi
          fi
        done

        # Check for changes in any of the component directories
        CHANGED_COMPONENTS=""
        GIT_CHANGES=""

        GITREVISION="$(params.gitrevision)"
        git fetch origin main:refs/remotes/origin/main --depth=100 2>/dev/null || true
        case "${GITREVISION}" in
          *pull/*|*refs/pull/*)
            echo "Revision ${GITREVISION} is a pull request. Checking changes against main branch..."
            GIT_CHANGES=$(git diff --name-only origin/main...HEAD 2>/dev/null || true)
            ;;
          *)
            echo "Revision ${GITREVISION} is a branch commit. Checking changes in the last commit..."
            GIT_CHANGES=$(git diff-tree --no-commit-id --name-only -r -m HEAD)
            ;;
        esac

        for dir in ${MODULES}; do
            echo "Checking if component '${dir}' has changes..."
            if echo "${GIT_CHANGES}" | grep -q "^${dir}/"; then
            echo "Found changed component: '${dir}'"
            CHANGED_COMPONENTS="${CHANGED_COMPONENTS} ${dir}"
            fi
        done

        # Trim leading space from the list of changed components
        CHANGED_COMPONENTS=$(echo "${CHANGED_COMPONENTS}" | sed 's/^ //')

        # If no components have changed, set should-build to false and exit
        if [ -z "${CHANGED_COMPONENTS}" ]; then
            echo "No buildpack-ready components changed."
            echo -n "false" > "$(results.should-build.path)"
            exit 0
        fi

        # Announce that we will build if there are any changed components
        echo -n "true" > "$(results.should-build.path)"
        echo "List of components to build: ${CHANGED_COMPONENTS}"

        json_array=$(echo "${CHANGED_COMPONENTS}" | awk '{printf "["; for(i=1;i<=NF;i++) printf "\"%s\"%s", $i, (i==NF?"":","); printf "]"}' )
        echo -n "${json_array}" > $(results.changed-modules-json.path)