apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: dispatch-builds
  namespace: saritasa-test
spec:
  params:
    - name: changed-components
      type: string
      description: Space-separated list of components that changed.
    - name: gitrevision
      type: string
      description: The git revision/sha to build.
    - name: action
      type: string
      description: Action to perform (build or deploy).
      default: "build"
  steps:
    - name: dispatch
      image: alpine/k8s:1.20.4
      script: |
        #!/bin/sh
        set -e

        CHANGED_COMPONENTS="$(params.changed-components)"
        ACTION="$(params.action)"
        GITREVISION="$(params.gitrevision)"

        if [ -z "${CHANGED_COMPONENTS}" ]; then
          echo "No components changed. Nothing to build or deploy."
          exit 0
        fi

        for component in ${CHANGED_COMPONENTS}; do
          # Clean up the name for Kubernetes resource naming (replace slash with hyphen)
          clean_name=$(echo "${component}" | tr '/' '-')
          
          # Determine builder image and buildpack based on language/category
          category=$(echo "${component}" | cut -d'/' -f1)
          
          builder="paketobuildpacks/builder-jammy-base:latest"
          buildpack=""
          
          case "${category}" in
            go) buildpack="paketo-buildpacks/go" ;;
            java) buildpack="paketo-buildpacks/java" ;;
            nodejs) buildpack="paketo-buildpacks/nodejs" ;;
            php) buildpack="paketo-buildpacks/php" ;;
            python) buildpack="paketo-buildpacks/python" ;;
            ruby) buildpack="paketo-buildpacks/ruby" ;;
            web-servers) buildpack="paketo-buildpacks/web-servers" ;;
          esac

          # Define the target registry and image name
          app_image="ghcr.io/saritasa-test/${clean_name}:${GITREVISION}"

          echo "Dispatching PipelineRun for ${component} with action ${ACTION}..."
          
          if [ "${ACTION}" = "deploy" ]; then
            cat <<EOF | kubectl apply -f -
        apiVersion: tekton.dev/v1beta1
        kind: PipelineRun
        metadata:
          generateName: deploy-${clean_name}-
          namespace: saritasa-test
        spec:
          serviceAccountName: pipeline-service-account
          taskSpec:
            workspaces:
              - name: source
            tasks:
              - name: build-task
                taskRef:
                  name: buildpack-build
                workspaces:
                  - name: source
                    workspace: source
                params:
                  - name: APP_IMAGE
                    value: "${app_image}"
                  - name: BUILDER_IMAGE
                    value: "${builder}"
                  - name: SOURCE_SUBPATH
                    value: "${component}"
                  - name: BUILDPACK
                    value: "${buildpack}"
              - name: deploy-task
                runAfter:
                  - build-task
                taskRef:
                  name: deploy-task
                params:
                  - name: DEPLOYMENT_NAME
                    value: "${clean_name}"
                  - name: IMAGE_NAME
                    value: "ghcr.io/saritasa-test/${clean_name}"
                  - name: TAG
                    value: "${GITREVISION}"
          workspaces:
            - name: source
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
        EOF
          else
            cat <<EOF | kubectl apply -f -
        apiVersion: tekton.dev/v1beta1
        kind: PipelineRun
        metadata:
          generateName: build-${clean_name}-
          namespace: saritasa-test
        spec:
          serviceAccountName: pipeline-service-account
          taskSpec:
            workspaces:
              - name: source
            tasks:
              - name: build-task
                taskRef:
                  name: buildpack-build
                workspaces:
                  - name: source
                    workspace: source
                params:
                  - name: APP_IMAGE
                    value: "${app_image}"
                  - name: BUILDER_IMAGE
                    value: "${builder}"
                  - name: SOURCE_SUBPATH
                    value: "${component}"
                  - name: BUILDPACK
                    value: "${buildpack}"
          workspaces:
            - name: source
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
        EOF
          fi
        done
