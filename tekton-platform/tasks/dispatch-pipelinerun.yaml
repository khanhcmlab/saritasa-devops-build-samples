apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: dispatch-pipelinerun
spec:
  description: >-
    Dispatches a child PipelineRun for a component via the EventListener, waits
    for a concurrency slot, starts it, and monitors it until completion.

    Flow: dispatch-request -> find-child -> wait-concurrency -> start -> monitor

  params:
    - name: component
      type: string
      description: The name of the component to build and deploy.
    - name: git-revision
      type: string
      description: The git revision/sha to build.
    - name: git-repository-url
      type: string
      description: The git repository URL.
    - name: registry-path
      type: string
      description: The target docker registry path.
    - name: action
      type: string
      description: The action to perform (build or deploy).
    - name: max-concurrency
      type: string
      description: Maximum number of concurrent PipelineRuns allowed.
    - name: namespace
      type: string
      description: The namespace for all PipelineRun operations.
    - name: container-name
      type: string
      description: The container name in the Deployment to patch.
    - name: clone-depth
      type: string
      description: The depth of the git clone.
    - name: delete-existing
      type: string
      description: Whether to clean the repo destination before cloning.
    - name: parent-pipelinerun
      type: string
      description: The name of the parent orchestrator PipelineRun.
    - name: changed-modules
      type: array
      description: The ordered list of changed modules (used for stagger index).
    - name: timeout
      type: string
      description: The timeout for the component pipeline.
    - name: deployment-timeout
      type: string
      description: The timeout for the deployment rollout check.

  steps:
    - name: dispatch-request
      image: alpine/k8s:1.33.13
      args:
        - "$(params.changed-modules[*])"
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        NAMESPACE="$(params.namespace)"
        COMPONENT="$(params.component)"
        EVENT_LISTENER_URL="http://el-gh-event-listener.${NAMESPACE}.svc.cluster.local:8080"

        # Determine this module's position in the changed-modules list
        INDEX=0
        for mod in "$@"; do
          [ "${mod}" = "${COMPONENT}" ] && break
          INDEX=$((INDEX + 1))
        done

        # Stagger requests by 1 second per module to avoid API collisions
        echo "Staggering dispatch by ${INDEX}s (module index: ${INDEX})..."
        sleep "${INDEX}"

        echo "Dispatching PipelineRun for component: ${COMPONENT}..."

        RESPONSE=$(curl -sf -X POST \
          -H "Content-Type: application/json" \
          -H "X-Event-Type: component-dispatch" \
          -d '{
            "component": "$(params.component)",
            "git-revision": "$(params.git-revision)",
            "git-repository-url": "$(params.git-repository-url)",
            "registry-path": "$(params.registry-path)",
            "action": "$(params.action)",
            "max-concurrency": "$(params.max-concurrency)",
            "namespace": "$(params.namespace)",
            "container-name": "$(params.container-name)",
            "clone-depth": "$(params.clone-depth)",
            "delete-existing": "$(params.delete-existing)",
            "parent-pipelinerun": "$(params.parent-pipelinerun)",
            "timeout": "$(params.timeout)",
            "deployment-timeout": "$(params.deployment-timeout)"
          }' \
          "${EVENT_LISTENER_URL}") || {
          echo "Error: EventListener request failed."
          exit 1
        }

        EVENT_ID=$(echo "${RESPONSE}" | jq -r '.eventID // empty')

        if [ -z "${EVENT_ID}" ]; then
          echo "Error: No eventID in response: ${RESPONSE}"
          exit 1
        fi

        echo -n "${EVENT_ID}" > /shared/event_id
        echo "Dispatched. Event ID: ${EVENT_ID}"

    - name: find-child-pipelinerun
      image: alpine/k8s:1.33.13
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        NAMESPACE="$(params.namespace)"
        TIMEOUT="$(params.deployment-timeout)"
        EVENT_ID=$(cat /shared/event_id)
        LABEL="triggers.tekton.dev/triggers-eventid=${EVENT_ID}"

        if [ -z "${EVENT_ID}" ]; then
          echo "Error: Event ID not found in /shared/event_id"
          exit 1
        fi

        echo "Waiting for child PipelineRun with label: ${LABEL}..."

        if ! kubectl wait pipelinerun -n "${NAMESPACE}" -l "${LABEL}" \
          --for=create --timeout="${TIMEOUT}" >/dev/null 2>&1; then
          echo "Error: Child PipelineRun not created within ${TIMEOUT}."
          exit 1
        fi

        CHILD_RUN=$(kubectl get pipelinerun -n "${NAMESPACE}" -l "${LABEL}" \
          -o jsonpath='{.items[0].metadata.name}')

        if [ -z "${CHILD_RUN}" ] || [ "${CHILD_RUN}" = "null" ]; then
          echo "Error: Child PipelineRun disappeared after creation."
          exit 1
        fi

        echo -n "${CHILD_RUN}" > /shared/child_run
        echo "Found child PipelineRun: ${CHILD_RUN} (Pending)"

    - name: wait-concurrency-slot
      image: alpine/k8s:1.33.13
      args:
        - "$(params.changed-modules[*])"
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        NAMESPACE="$(params.namespace)"
        MAX_CONCURRENCY="$(params.max-concurrency)"
        COMPONENT="$(params.component)"
        POLL_INTERVAL=10

        # Determine this module's position for staggered checking
        INDEX=0
        for mod in "$@"; do
          [ "${mod}" = "${COMPONENT}" ] && break
          INDEX=$((INDEX + 1))
        done

        STAGGER_DELAY=$((INDEX * POLL_INTERVAL))
        echo "Staggering concurrency check by ${STAGGER_DELAY}s (module index: ${INDEX})..."
        sleep "${STAGGER_DELAY}"

        # Count PipelineRuns that reference "component-pipeline" and have not
        # yet reached a terminal state (Succeeded != True/False).
        get_active_count() {
          kubectl get pipelinerun -n "${NAMESPACE}" -o json 2>/dev/null | jq '
            [.items[] |
              select(.spec.pipelineRef.name == "component-pipeline") |
              select(
                (.status.conditions // [] | map(select(.type == "Succeeded"))[0].status // "Unknown")
                as $s | $s != "True" and $s != "False"
              )
            ] | length
          '
        }

        # Poll until a concurrency slot is available
        while true; do
          ACTIVE=$(get_active_count)
          echo "Active PipelineRuns: ${ACTIVE} / ${MAX_CONCURRENCY}"

          if [ "${ACTIVE}" -lt "${MAX_CONCURRENCY}" ]; then
            echo "Concurrency slot available. Proceeding."
            break
          fi

          echo "Concurrency limit reached. Retrying in ${POLL_INTERVAL}s..."
          sleep "${POLL_INTERVAL}"
        done

    - name: start-pipelinerun
      image: alpine/k8s:1.33.13
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        NAMESPACE="$(params.namespace)"
        CHILD_RUN=$(cat /shared/child_run)

        if [ -z "${CHILD_RUN}" ]; then
          echo "Error: Child PipelineRun name not found."
          exit 1
        fi

        echo "Starting child PipelineRun: ${CHILD_RUN}..."
        kubectl patch pipelinerun "${CHILD_RUN}" -n "${NAMESPACE}" \
          --type=merge -p '{"spec":{"status":null}}'

    - name: monitor-pipelinerun
      image: alpine/k8s:1.33.13
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        NAMESPACE="$(params.namespace)"
        CHILD_RUN=$(cat /shared/child_run)
        POLL_INTERVAL=10

        if [ -z "${CHILD_RUN}" ]; then
          echo "Error: Child PipelineRun name not found."
          exit 1
        fi

        echo "Monitoring child PipelineRun: ${CHILD_RUN}..."

        get_status() {
          kubectl get pipelinerun "${CHILD_RUN}" -n "${NAMESPACE}" -o json 2>/dev/null | \
            jq -r '(.status.conditions // [] | map(select(.type == "Succeeded"))[0].status) // "Unknown"'
        }

        get_reason() {
          kubectl get pipelinerun "${CHILD_RUN}" -n "${NAMESPACE}" -o json 2>/dev/null | \
            jq -r '(.status.conditions // [] | map(select(.type == "Succeeded"))[0].reason) // "Unknown"'
        }

        while true; do
          STATUS=$(get_status)
          REASON=$(get_reason)

          case "${STATUS}" in
            True)  echo "Child PipelineRun ${CHILD_RUN} succeeded!"; exit 0 ;;
            False) echo "Child PipelineRun ${CHILD_RUN} failed. Reason: ${REASON}"; exit 1 ;;
            *)     echo "Still running (status: ${STATUS}, reason: ${REASON}). Polling in ${POLL_INTERVAL}s..." ;;
          esac

          sleep "${POLL_INTERVAL}"
        done

  volumes:
    - name: shared-data
      emptyDir: {}