apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: dispatch-pipelinerun
  namespace: saritasa-test
spec:
  params:
    - name: COMPONENT
      type: string
    - name: gitrevision
      type: string
    - name: gitrepositoryurl
      type: string
    - name: registry-path
      type: string
    - name: action
      type: string
  steps:
    - name: dispatch
      image: alpine/k8s:1.20.4
      script: |
        #!/bin/sh
        set -e

        PARAM_COMPONENT="$(params.COMPONENT)"
        PARAM_GITREVISION="$(params.gitrevision)"
        PARAM_GITURL="$(params.gitrepositoryurl)"
        PARAM_REGISTRY="$(params.registry-path)"
        PARAM_ACTION="$(params.action)"

        COMPONENT_CLEAN=$(echo "$PARAM_COMPONENT" | tr '/_' '--')

        echo "Dispatching PipelineRun for component: ${PARAM_COMPONENT} (clean name: ${COMPONENT_CLEAN})"

        # Generate a unique ID using date
        UNIQUE_ID=$(date +%s%N | cut -c1-15)
        SOURCE_PVC_NAME="${COMPONENT_CLEAN}-source-ws-${UNIQUE_ID}"
        CACHE_PVC_NAME="${COMPONENT_CLEAN}-cache-ws-${UNIQUE_ID}"

        echo "Creating PVCs ${SOURCE_PVC_NAME} and ${CACHE_PVC_NAME} and PipelineRun..."

        cat <<EOF | kubectl create -f -
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${SOURCE_PVC_NAME}
          namespace: saritasa-test
        spec:
          accessModes:
            - ReadWriteMany
          storageClassName: nfs-rwx
          resources:
            requests:
              storage: 5Gi
        ---
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${CACHE_PVC_NAME}
          namespace: saritasa-test
        spec:
          accessModes:
            - ReadWriteMany
          storageClassName: nfs-rwx
          resources:
            requests:
              storage: 2Gi
        ---
        apiVersion: tekton.dev/v1beta1
        kind: PipelineRun
        metadata:
          name: ${COMPONENT_CLEAN}-pipelinerun-${UNIQUE_ID}
          namespace: saritasa-test
        spec:
          serviceAccountName: pipeline-service-account
          pipelineRef:
            name: component-pipeline
          podTemplate:
            nodeSelector:
              node: hp
          workspaces:
            - name: source-workspace
              persistentVolumeClaim:
                claimName: ${SOURCE_PVC_NAME}
            - name: cache
              persistentVolumeClaim:
                claimName: ${CACHE_PVC_NAME}
          params:
            - name: component
              value: "${PARAM_COMPONENT}"
            - name: gitrevision
              value: "${PARAM_GITREVISION}"
            - name: gitrepositoryurl
              value: "${PARAM_GITURL}"
            - name: registry-path
              value: "${PARAM_REGISTRY}"
            - name: action
              value: "${PARAM_ACTION}"
        EOF