apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: dispatch-pipelinerun
spec:
  description: >-
    Dispatches a downstream PipelineRun for a specific component by posting an HTTP request
    to the EventListener, which uses a TriggerTemplate to spawn it.
  params:
    - name: component
      type: string
      description: The name of the component to build and deploy.
    - name: git-revision
      type: string
      description: The git revision/sha to build.
    - name: git-repository-url
      type: string
      description: The git repository URL.
    - name: registry-path
      type: string
      description: The target docker registry path.
    - name: action
      type: string
      description: The action to perform (build or deploy).
    - name: max-concurrency
      type: string
      description: Maximum number of concurrent PipelineRuns allowed in the namespace.
    - name: namespace
      type: string
      description: The namespace to check active PipelineRuns in.
    - name: container-name
      type: string
      description: The container name in the Deployment to patch.
    - name: clone-depth
      type: string
      description: The depth of the git clone.
    - name: delete-existing
      type: string
      description: Clean out the contents of the repo's destination directory if it already exists before cloning.
  steps:
    - name: dispatch
      image: curlimages/curl:7.85.0
      script: |
        #!/bin/sh
        set -e

        COMPONENT_CLEAN=$(echo "$(params.component)" | tr '/_' '--')

        echo "Dispatching PipelineRun for component: $(params.component) (clean name: ${COMPONENT_CLEAN}) via EventListener..."

        curl -X POST \
          -H "Content-Type: application/json" \
          -H "X-Event-Type: component-dispatch" \
          -d '{
            "component": "$(params.component)",
            "git-revision": "$(params.git-revision)",
            "git-repository-url": "$(params.git-repository-url)",
            "registry-path": "$(params.registry-path)",
            "action": "$(params.action)",
            "max-concurrency": "$(params.max-concurrency)",
            "namespace": "$(params.namespace)",
            "container-name": "$(params.container-name)",
            "clone-depth": "$(params.clone-depth)",
            "delete-existing": "$(params.delete-existing)"
          }' \
          "http://el-gh-event-listener.$(params.namespace).svc.cluster.local:8080"