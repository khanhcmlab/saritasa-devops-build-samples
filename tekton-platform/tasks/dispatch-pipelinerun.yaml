apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: dispatch-pipelinerun
spec:
  description: >-
    Dispatches a downstream PipelineRun for a specific component by posting an HTTP request
    to the EventListener, which uses a TriggerTemplate to spawn it.
  params:
    - name: component
      type: string
      description: The name of the component to build and deploy.
    - name: git-revision
      type: string
      description: The git revision/sha to build.
    - name: git-repository-url
      type: string
      description: The git repository URL.
    - name: registry-path
      type: string
      description: The target docker registry path.
    - name: action
      type: string
      description: The action to perform (build or deploy).
    - name: max-concurrency
      type: string
      description: Maximum number of concurrent PipelineRuns allowed in the namespace.
    - name: namespace
      type: string
      description: The namespace to check active PipelineRuns in.
    - name: container-name
      type: string
      description: The container name in the Deployment to patch.
    - name: clone-depth
      type: string
      description: The depth of the git clone.
    - name: delete-existing
      type: string
      description: Clean out the contents of the repo's destination directory if it already exists before cloning.
    - name: parent-pipelinerun
      type: string
      description: The name of the parent orchestrator PipelineRun.
    - name: changed-modules
      type: array
      description: The list of changed modules to build.
    - name: timeout
      type: string
      description: The timeout for the component pipeline
    - name: deployment-timeout
      type: string
      description: The timeout for the deployment rollout check

  steps:
    - name: dispatch-request
      image: alpine/k8s:1.33.13
      args:
        - "$(params.changed-modules[*])"
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        PARAM_NAMESPACE="$(params.namespace)"
        CURRENT_MODULE="$(params.component)"

        INDEX=0
        for mod in "$@"; do
          if [ "${mod}" = "${CURRENT_MODULE}" ]; then
            break
          fi
          INDEX=$((INDEX + 1))
        done

        # Stagger HTTP dispatch requests slightly to prevent API collisions
        CURL_DELAY=$((INDEX * 1))
        echo "Staggering HTTP dispatch by ${CURL_DELAY} seconds (index: ${INDEX})..."
        sleep ${CURL_DELAY}

        COMPONENT_CLEAN=$(echo "$(params.component)" | tr '/_' '--')
        echo "Dispatching pending PipelineRun for component: $(params.component) (clean name: ${COMPONENT_CLEAN}) via EventListener..."

        RESPONSE=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          -H "X-Event-Type: component-dispatch" \
          -d '{
            "component": "$(params.component)",
            "git-revision": "$(params.git-revision)",
            "git-repository-url": "$(params.git-repository-url)",
            "registry-path": "$(params.registry-path)",
            "action": "$(params.action)",
            "max-concurrency": "$(params.max-concurrency)",
            "namespace": "$(params.namespace)",
            "container-name": "$(params.container-name)",
            "clone-depth": "$(params.clone-depth)",
            "delete-existing": "$(params.delete-existing)",
            "parent-pipelinerun": "$(params.parent-pipelinerun)",
            "timeout": "$(params.timeout)",
            "deployment-timeout": "$(params.deployment-timeout)"
          }' \
          "http://el-gh-event-listener.${PARAM_NAMESPACE}.svc.cluster.local:8080")

        EVENT_ID=$(echo "${RESPONSE}" | jq -r '.eventID' 2>/dev/null || true)

        if [ -z "${EVENT_ID}" ] || [ "${EVENT_ID}" = "null" ]; then
          echo "Error: Failed to obtain eventID from EventListener response."
          echo "Response was: ${RESPONSE}"
          exit 1
        fi

        echo -n "${EVENT_ID}" > /shared/event_id
        echo "Event ID ${EVENT_ID} written to shared volume."

    - name: find-child-pipelinerun
      image: alpine/k8s:1.33.13
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        PARAM_NAMESPACE="$(params.namespace)"
        EVENT_ID=$(cat /shared/event_id 2>/dev/null || echo "")

        if [ -z "${EVENT_ID}" ]; then
          echo "Error: Event ID not found"
          exit 1
        fi

        kubectl wait pipelinerun \
          -n "${PARAM_NAMESPACE}" \
          -l "triggers.tekton.dev/triggers-eventid=${EVENT_ID}" \
          --for=create \
          --timeout=$(params.deployment-timeout) >/dev/null 2>&1
        
        if [ $? -ne 0 ]; then
          echo "Error: Failed to find child PipelineRun with eventID: ${EVENT_ID} after 30 seconds."
          exit 1
        fi

        CHILD_RUN=$(kubectl get pipelinerun -n "${PARAM_NAMESPACE}" \
          -l "triggers.tekton.dev/triggers-eventid=${EVENT_ID}" \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

        if [[ -z "${CHILD_RUN}" || "${CHILD_RUN}" == "null" ]]; then
          echo "Error: Resource disappeared right after creation."
          exit 1
        fi

        echo -n "${CHILD_RUN}" > /shared/child_run
        echo "Successfully dispatched child PipelineRun: ${CHILD_RUN} (currently Pending)"

    - name: wait-concurrency-limit
      image: alpine/k8s:1.33.13
      args:
        - "$(params.changed-modules[*])"
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        PARAM_NAMESPACE="$(params.namespace)"
        MAX_CONCURRENCY="$(params.max-concurrency)"
        CURRENT_MODULE="$(params.component)"

        INDEX=0
        for mod in "$@"; do
          if [ "${mod}" = "${CURRENT_MODULE}" ]; then
            break
          fi
          INDEX=$((INDEX + 1))
        done

        # Stagger concurrency check to prevent race conditions during starting
        STAGGER_DELAY=$((INDEX * 10))
        echo "Staggering concurrency check by ${STAGGER_DELAY} seconds (index: ${INDEX})..."
        sleep ${STAGGER_DELAY}

        # Function to get count of active (running) component PipelineRuns
        get_active_count() {
          kubectl get pipelinerun -n ${PARAM_NAMESPACE} -o json 2>/dev/null | \
            jq '[.items[] | select(.spec.pipelineRef.name == "component-pipeline") | select(.spec.status != "PipelineRunPending") | select(.status.conditions == null or ([.status.conditions[]? | select(.type == "Succeeded" and (.status == "True" or .status == "False"))] | length == 0))] | length' 2>/dev/null || echo "0"
        }

        # Enforce concurrency limit before starting execution
        while true; do
          ACTIVE_COUNT=$(get_active_count)
          echo "Current active running component PipelineRuns: ${ACTIVE_COUNT} (max allowed: ${MAX_CONCURRENCY})"
          if [ "${ACTIVE_COUNT}" -lt "${MAX_CONCURRENCY}" ]; then
            break
          fi
          echo "Concurrency limit reached. Waiting 10 seconds..."
          sleep 10
        done

    - name: start-pipelinerun
      image: alpine/k8s:1.33.13
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        PARAM_NAMESPACE="$(params.namespace)"
        CHILD_RUN=$(cat /shared/child_run)

        if [ -z "${CHILD_RUN}" ]; then
          echo "Error: Child PipelineRun name not found in /shared/child_run."
          exit 1
        fi

        # Start the pending child PipelineRun
        echo "Starting pending child PipelineRun: ${CHILD_RUN}..."
        kubectl patch pipelinerun "${CHILD_RUN}" -n "${PARAM_NAMESPACE}" --type=merge -p '{"spec":{"status":null}}'

    - name: monitor-pipelinerun
      image: alpine/k8s:1.33.13
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      script: |
        #!/bin/sh
        set -e

        PARAM_NAMESPACE="$(params.namespace)"
        CHILD_RUN=$(cat /shared/child_run)

        if [ -z "${CHILD_RUN}" ]; then
          echo "Error: Child PipelineRun name not found in /shared/child_run."
          exit 1
        fi

        # Wait for the child PipelineRun to complete
        while true; do
          PIPELINERUN_JSON=$(kubectl get pipelinerun ${CHILD_RUN} -n ${PARAM_NAMESPACE} -o json 2>/dev/null || echo "{}")
          STATUS=$(echo "${PIPELINERUN_JSON}" | jq -r '.status.conditions[]? | select(.type == "Succeeded") | .status' 2>/dev/null || echo "null")
          REASON=$(echo "${PIPELINERUN_JSON}" | jq -r '.status.conditions[]? | select(.type == "Succeeded") | .reason' 2>/dev/null || echo "null")

          # Handle the case where status is not yet populated
          if [ -z "${STATUS}" ] || [ "${STATUS}" = "null" ]; then
            STATUS="Unknown"
          fi

          if [ "${STATUS}" = "True" ]; then
            echo "Child PipelineRun ${CHILD_RUN} completed successfully!"
            break
          elif [ "${STATUS}" = "False" ]; then
            echo "Child PipelineRun ${CHILD_RUN} failed with reason: ${REASON}."
            exit 1
          fi

          echo "Child PipelineRun ${CHILD_RUN} is still running (status: ${STATUS}, reason: ${REASON}). Waiting 10 seconds..."
          sleep 10
        done

  volumes:
    - name: shared-data
      emptyDir: {}