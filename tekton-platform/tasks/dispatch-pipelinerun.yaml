apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: dispatch-pipelinerun
spec:
  params:
    - name: component
      type: string
      description: The name of the component to build and deploy.
    - name: git-revision
      type: string
      description: The git revision/sha to build.
    - name: git-repository-url
      type: string
      description: The git repository URL.
    - name: registry-path
      type: string
      description: The target docker registry path.
    - name: action
      type: string
      description: The action to perform (build or deploy).
    - name: max-concurrency
      type: string
      description: Maximum number of concurrent PipelineRuns allowed in the namespace.
    - name: namespace
      type: string
      description: The namespace to check active PipelineRuns in.
    - name: container-name
      type: string
      description: The container name in the Deployment to patch.
    - name: clone-depth
      type: string
      description: The depth of the git clone.
    - name: delete-existing
      type: string
      description: Clean out the contents of the repo's destination directory if it already exists before cloning.
  steps:
    - name: dispatch
      image: alpine/k8s:1.20.4
      script: |
        #!/bin/sh
        set -e

        PARAM_COMPONENT="$(params.component)"
        PARAM_GITREVISION="$(params.git-revision)"
        PARAM_GITURL="$(params.git-repository-url)"
        PARAM_REGISTRY="$(params.registry-path)"
        PARAM_ACTION="$(params.action)"
        PARAM_MAX_CONCURRENCY="$(params.max-concurrency)"
        PARAM_NAMESPACE="$(params.namespace)"
        PARAM_CONTAINER_NAME="$(params.container-name)"
        PARAM_CLONE_DEPTH="$(params.clone-depth)"
        PARAM_DELETE_EXISTING="$(params.delete-existing)"

        COMPONENT_CLEAN=$(echo "$PARAM_COMPONENT" | tr '/_' '--')

        echo "Dispatching PipelineRun for component: ${PARAM_COMPONENT} (clean name: ${COMPONENT_CLEAN})"

        echo "Creating PVCs ${SOURCE_PVC_NAME} and ${CACHE_PVC_NAME} and PipelineRun..."


        cat <<EOF | kubectl create -f -
        apiVersion: tekton.dev/v1beta1
        kind: PipelineRun
        metadata:
          generateName: ${COMPONENT_CLEAN}-pipelinerun-
          namespace: ${PARAM_NAMESPACE}
        spec:
          serviceAccountName: pipeline-service-account
          pipelineRef:
            name: component-pipeline
          podTemplate:
            nodeSelector:
              node: hp
          workspaces:
            - name: source-workspace
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
            - name: cache
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
          params:
            - name: component
              value: "${PARAM_COMPONENT}"
            - name: git-revision
              value: "${PARAM_GITREVISION}"
            - name: git-repository-url
              value: "${PARAM_GITURL}"
            - name: registry-path
              value: "${PARAM_REGISTRY}"
            - name: action
              value: "${PARAM_ACTION}"
            - name: max-concurrency
              value: "${PARAM_MAX_CONCURRENCY}"
            - name: namespace
              value: "${PARAM_NAMESPACE}"
            - name: container-name
              value: "${PARAM_CONTAINER_NAME}"
            - name: clone-depth
              value: "${PARAM_CLONE_DEPTH}"
            - name: delete-existing
              value: "${PARAM_DELETE_EXISTING}"
        EOF