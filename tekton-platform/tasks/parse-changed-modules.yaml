apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: parse-changed-modules
spec:
  description: >-
    Parses a string of changed modules (which could be space, comma, or JSON-formatted)
    into a structured array of module names.
  params:
    - name: changed-modules
      type: string
      description: The raw list of changed modules.
  results:
    - name: changed-modules
      type: array
      description: The parsed list of changed modules as an array.
  steps:
    - name: parse
      image: alpine/k8s:1.33.13
      env:
        - name: CHANGED_MODULES
          value: "$(params.changed-modules)"
      script: |
        #!/bin/sh
        CLEANED=$(echo -n "${CHANGED_MODULES}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        echo -n "${CLEANED}" | jq -Rs '
          if . == "" or . == "[]" or . == "[\"\"]" then []
          elif startswith("[") then fromjson
          else gsub(","; " ") | split(" ") | map(select(. != ""))
          end
        ' -c > "$(results.changed-modules.path)"
