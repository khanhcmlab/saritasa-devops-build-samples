apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: parse-changed-modules
spec:
  description: >-
    Parses a string of changed modules (which could be space, comma, or JSON-formatted)
    into a structured array of module names.
  params:
    - name: changed-modules
      type: string
      description: The raw list of changed modules.
  results:
    - name: changed-modules
      type: array
      description: The parsed list of changed modules as an array.
  steps:
    - name: parse
      image: alpine/k8s:1.33.13
      env:
        - name: CHANGED_MODULES
          value: "$(params.changed-modules)"
      script: |
        #!/bin/sh
        
        # Trim whitespace from input.
        CLEANED=$(echo -n "${CHANGED_MODULES}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        
        # Parse input into newline-separated list of file paths.
        FILES=$(echo -n "${CLEANED}" | jq -Rs '
          if . == "" or . == "[]" or . == "[\"\"]" then []
          elif startswith("[") then fromjson
          else gsub(","; " ") | split(" ") | map(select(. != ""))
          end
        ' | jq -r '.[]')
        
        # Extract module paths:
        # - Java modules: split by /src/ and take the first part
        # - Others: take the first two path segments
        MODULES=""
        for f in ${FILES}; do
          case "${f}" in
            java/*)
              mod=$(echo "${f}" | sed 's|/src/.*||')
              ;;
            *)
              mod=$(echo "${f}" | cut -d'/' -f1-2)
              ;;
          esac
          MODULES="${MODULES}${mod}\n"
        done
        
        # Deduplicate and convert to JSON array.
        printf "${MODULES}" | sort -u | sed '/^$/d' | jq -Rsc 'split("\n") | map(select(. != ""))' \
          > "$(results.changed-modules.path)"
