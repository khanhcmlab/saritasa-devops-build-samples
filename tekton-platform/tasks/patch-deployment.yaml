apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: patch-deployment
spec:
  description: >-
    Patches a Kubernetes Deployment with a new image tag (typically the commit SHA)
    and monitors the rollout to completion.
  workspaces:
    - name: source
      description: Workspace containing the application source code and scripts.
  params:
    - name: deployment-name
      type: string
      description: The name of the Deployment to patch.
    - name: container-name
      type: string
      description: The container name in the Deployment to patch.
    - name: image-name
      type: string
      description: The base image name (without tag).
    - name: tag
      type: string
      description: The new image tag (e.g., commit SHA) to apply.
    - name: namespace
      type: string
      description: The target Kubernetes namespace.
  steps:
    - name: patch-deployment
      image: alpine/k8s:1.20.4
      script: |
        #!/bin/sh
        set -e

        if ! kubectl get deployment $(params.deployment-name) -n $(params.namespace) >/dev/null 2>&1; then
          echo "Deployment '$(params.deployment-name)' does not exist in namespace '$(params.namespace)'. Creating it..."
          kubectl create deployment $(params.deployment-name) --image=$(params.image-name):$(params.tag) -n $(params.namespace)
          kubectl patch deployment $(params.deployment-name) -n $(params.namespace) --type='json' -p="[{\"op\": \"replace\", \"path\": \"/spec/template/spec/containers/0/name\", \"value\": \"$(params.container-name)\"}, {\"op\": \"add\", \"path\": \"/spec/template/spec/imagePullSecrets\", \"value\": [{\"name\": \"ghcr-creds\"}]}, {\"op\": \"add\", \"path\": \"/spec/template/spec/serviceAccountName\", \"value\": \"pipeline-service-account\"}, {\"op\": \"add\", \"path\": \"/spec/template/spec/nodeSelector\", \"value\": {\"node\": \"hp\"}}]"
        else
          echo "Patching deployment '$(params.deployment-name)' in namespace '$(params.namespace)'..."
          echo "Setting image for container '$(params.container-name)' to '$(params.image-name):$(params.tag)'..."

          # Update the deployment's container image
          kubectl set image deployment/$(params.deployment-name) \
            $(params.container-name)=$(params.image-name):$(params.tag) \
            -n $(params.namespace)

          # Ensure the deployment is scheduled on the node with label node=hp
          kubectl patch deployment $(params.deployment-name) -n $(params.namespace) -p '{"spec":{"template":{"spec":{"nodeSelector":{"node":"hp"}}}}}'
        fi

        # Monitor and verify the rollout status
        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/$(params.deployment-name) -n $(params.namespace)
