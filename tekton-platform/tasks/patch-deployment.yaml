apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: patch-deployment
  namespace: saritasa-test
spec:
  description: >-
    Patches a Kubernetes Deployment with a new image tag (typically the commit SHA)
    and monitors the rollout to completion.
  workspaces:
    - name: source
      description: Workspace containing the application source code and scripts.
  params:
    - name: DEPLOYMENT_NAME
      type: string
      description: The name of the Deployment to patch.
    - name: CONTAINER_NAME
      type: string
      description: The container name in the Deployment to patch.
      default: "app"
    - name: IMAGE_NAME
      type: string
      description: The base image name (without tag).
    - name: TAG
      type: string
      description: The new image tag (e.g., commit SHA) to apply.
    - name: NAMESPACE
      type: string
      description: The target Kubernetes namespace.
      default: "saritasa-test"
  steps:
    - name: patch-deployment
      image: alpine/k8s:1.20.4
      script: |
        #!/bin/sh
        set -e

        if ! kubectl get deployment $(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE) >/dev/null 2>&1; then
          echo "Deployment '$(params.DEPLOYMENT_NAME)' does not exist in namespace '$(params.NAMESPACE)'. Creating it..."
          kubectl create deployment $(params.DEPLOYMENT_NAME) --image=$(params.IMAGE_NAME):$(params.TAG) -n $(params.NAMESPACE)
          kubectl patch deployment $(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE) --type='json' -p="[{\"op\": \"replace\", \"path\": \"/spec/template/spec/containers/0/name\", \"value\": \"$(params.CONTAINER_NAME)\"}, {\"op\": \"add\", \"path\": \"/spec/template/spec/imagePullSecrets\", \"value\": [{\"name\": \"ghcr-creds\"}]}, {\"op\": \"add\", \"path\": \"/spec/template/spec/serviceAccountName\", \"value\": \"pipeline-service-account\"}, {\"op\": \"add\", \"path\": \"/spec/template/spec/nodeSelector\", \"value\": {\"node\": \"hp\"}}]"
        else
          echo "Patching deployment '$(params.DEPLOYMENT_NAME)' in namespace '$(params.NAMESPACE)'..."
          echo "Setting image for container '$(params.CONTAINER_NAME)' to '$(params.IMAGE_NAME):$(params.TAG)'..."

          # Update the deployment's container image
          kubectl set image deployment/$(params.DEPLOYMENT_NAME) \
            $(params.CONTAINER_NAME)=$(params.IMAGE_NAME):$(params.TAG) \
            -n $(params.NAMESPACE)

          # Ensure the deployment is scheduled on the node with label node=hp
          kubectl patch deployment $(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE) -p '{"spec":{"template":{"spec":{"nodeSelector":{"node":"hp"}}}}}'
        fi

        # Monitor and verify the rollout status
        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/$(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE)
