apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: patch-deployment
  namespace: saritasa-test
spec:
  description: >-
    Patches a Kubernetes Deployment with a new image tag (typically the commit SHA)
    and monitors the rollout to completion.
  workspaces:
    - name: source
      description: Workspace containing the application source code and scripts.
  params:
    - name: DEPLOYMENT_NAME
      type: string
      description: The name of the Deployment to patch.
    - name: CONTAINER_NAME
      type: string
      description: The container name in the Deployment to patch.
      default: "app"
    - name: IMAGE_NAME
      type: string
      description: The base image name (without tag).
    - name: TAG
      type: string
      description: The new image tag (e.g., commit SHA) to apply.
    - name: NAMESPACE
      type: string
      description: The target Kubernetes namespace.
      default: "saritasa-test"
  steps:
    - name: patch-deployment
      image: alpine/k8s:1.20.4
      script: |
        #!/bin/sh
        set -e

        echo "Patching deployment '$(params.DEPLOYMENT_NAME)' in namespace '$(params.NAMESPACE)'..."
        echo "Setting image for container '$(params.CONTAINER_NAME)' to '$(params.IMAGE_NAME):$(params.TAG)'..."

        # Update the deployment's container image
        kubectl set image deployment/$(params.DEPLOYMENT_NAME) \
          $(params.CONTAINER_NAME)=$(params.IMAGE_NAME):$(params.TAG) \
          -n $(params.NAMESPACE)

        # Monitor and verify the rollout status
        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/$(params.DEPLOYMENT_NAME) -n $(params.NAMESPACE)
