apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: patch-deployment
  namespace: saritasa-test
spec:
  description: >-
    Patches a Kubernetes Deployment with a new image tag (typically the commit SHA)
    and monitors the rollout to completion.
  workspaces:
    - name: source
      description: Workspace containing the application source code and scripts.
  params:
    - name: DEPLOYMENT_NAME
      type: string
      description: The name of the Deployment to patch.
    - name: CONTAINER_NAME
      type: string
      description: The container name in the Deployment to patch.
      default: "app"
    - name: IMAGE_NAME
      type: string
      description: The base image name (without tag).
    - name: TAG
      type: string
      description: The new image tag (e.g., commit SHA) to apply.
    - name: NAMESPACE
      type: string
      description: The target Kubernetes namespace.
      default: "saritasa-test"
  steps:
    - name: patch-deployment
      image: alpine/k8s:1.20.4
      env:
        - name: DEPLOYMENT_NAME
          value: $(params.DEPLOYMENT_NAME)
        - name: CONTAINER_NAME
          value: $(params.CONTAINER_NAME)
        - name: IMAGE_NAME
          value: $(params.IMAGE_NAME)
        - name: TAG
          value: $(params.TAG)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
      script: |
        sh $(workspaces.source.path)/tekton-platform/scripts/patch-deployment.sh
