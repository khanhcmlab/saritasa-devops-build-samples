apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-local-path-pvc
  namespace: saritasa-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-local-path-pod
  namespace: saritasa-test
spec:
  containers:
    - name: test-container
      image: alpine:latest
      command: ["/bin/sh", "-c", "echo 'Hello from Local Path Storage!' > /data/test.txt && cat /data/test.txt && sleep 3600"]
      volumeMounts:
        - name: local-path-vol
          mountPath: /data
  volumes:
    - name: local-path-vol
      persistentVolumeClaim:
        claimName: test-local-path-pvc
