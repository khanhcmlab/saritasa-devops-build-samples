apiVersion: triggers.tekton.dev/v1alpha1
kind: EventListener
metadata:
  name: gh-event-listener
  namespace: saritasa-test
spec:
  serviceAccountName: pipeline-service-account
  triggers:
    - name: merge-main-trigger
      interceptors:
        - ref:
            name: "github"
          params:
            - name: "secretRef"
              value:
                secretName: "github-webhook-secret"
                secretKey: "token"
            - name: "eventTypes"
              value: ["push"]
        - ref:
            name: "cel"
          params:
            - name: "filter"
              value: "body.ref == 'refs/heads/feature/test-ci-cd-2-changes' || body.ref == 'refs/heads/main'"
        - ref:
            name: "cel"
          params:
            - name: "filter"
              # This filter checks if there are less than 2 PipelineRuns with the label "tekton.dev/pipeline=my-heavy-pipeline" that are not in Succeeded or Failed state. Adjust the label selector and namespace as needed.
              value: >
                k8s.list("tekton.dev/v1", "PipelineRun", "your-namespace", "tekton.dev/pipeline=my-heavy-pipeline").filter(pr, !pr.status.conditions.any(c, c.type == "Succeeded" || c.type == "Failed")).size() < 2
      bindings:
        - ref: github-merge-binding
      template:
        ref: trigger-template