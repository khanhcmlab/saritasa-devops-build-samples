---
apiVersion: triggers.tekton.dev/v1alpha1
kind: TriggerBinding
metadata:
  name: github-merge-binding
spec:
  params:
    - name: git-revision
      value: $(body.after)
    - name: git-repository-url
      value: $(body.repository.clone_url)
    - name: action
      value: "deploy"
    - name: registry-path
      value: "ghcr.io/dewwripper"
    - name: max-concurrency
      value: "2"
    - name: namespace
      value: "saritasa-test"
    - name: container-name
      value: "app"
    - name: clone-depth
      value: "2"
    - name: delete-existing
      value: "true"
    - name: changed-modules
      value: $(extensions.changed_modules)
    - name: pipeline-timeout
      value: "10m"
    - name: deployment-timeout
      value: "60s"
    - name: workspace-size
      value: "1Gi"