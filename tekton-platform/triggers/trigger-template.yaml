apiVersion: triggers.tekton.dev/v1alpha1
kind: TriggerTemplate
metadata:
  name: trigger-template
  namespace: saritasa-test
spec:
  params:
    - name: gitrevision
      description: The git revision/sha to build
    - name: gitrepositoryurl
      description: The git repository URL
    - name: action
      description: The action to perform (build or deploy)
      default: "build"
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: orchestrator-pipelinerun-
        namespace: saritasa-test
      spec:
        serviceAccountName: pipeline-service-account
        pipelineRef:
          name: orchestrator-pipeline
        timeouts:
          pipeline: "4h0m0s"
          tasks: "4h0m0s"
        podTemplate:
          nodeSelector:
            node: hp
        workspaces:
          - name: source-workspace
            volumeClaimTemplate:
              spec:
                storageClassName: nfs-rwx
                accessModes:
                  - ReadWriteMany
                resources:
                  requests:
                    storage: 5Gi
        params:
          - name: gitrevision
            value: $(tt.params.gitrevision)
          - name: gitrepositoryurl
            value: $(tt.params.gitrepositoryurl)
          - name: action
            value: $(tt.params.action)


